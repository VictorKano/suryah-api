services:
  - type: web
    name: suryah-api
    runtime: java
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/suryah-api-0.0.1-SNAPSHOT.jar
    healthCheckPath: /actuator/health
    envVars:
      # ── Required — set these in the Render dashboard ───────────────────────
      - key: DB_URL
        sync: false          # Set manually in Render → value: jdbc:postgresql://ep-summer-moon-b60mm2tt.c-2.sa-east-1.aws.neon.tech/neondb
      - key: DB_USER
        sync: false          # neondb_owner
      - key: DB_PASSWORD
        sync: false          # from Neon console
      - key: JWT_SECRET
        generateValue: true  # Render generates a random value automatically
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # Set to your Vercel URL after frontend deploy
      # ── Optional — only needed if email is enabled ─────────────────────────
      - key: MAIL_ENABLED
        value: "false"       # Change to "true" once Gmail credentials are set
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_STUDIO_NAME
        value: Suryah
      # ── Spring profile ──────────────────────────────────────────────────────
      - key: SPRING_PROFILES_ACTIVE
        value: prod
