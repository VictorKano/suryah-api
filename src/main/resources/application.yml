spring:
  application:
    name: suryah-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/suryah}
    username: ${DB_USER:suryah}
    password: ${DB_PASSWORD:suryah}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: America/Sao_Paulo
  main:
    lazy-initialization: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:suryah-dev-secret-key-must-be-at-least-32-chars-long}
  expiration-hours: ${JWT_EXPIRATION_HOURS:24}
